[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-budget-plaid-excel"
version = "0.1.0"
description = "Local Plaid-to-Excel personal budget workflow."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
]

[project.scripts]
personal-budget-plaid-excel = "personal_budget_plaid_excel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

